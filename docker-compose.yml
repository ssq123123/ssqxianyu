version: '3.8'

services:
  # 后端应用服务
  xianyu-monitor:
    build: .
    container_name: xianyu-monitor-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://xianyu_user:xianyu_password@mongodb:27017/xianyu_monitor
      - JWT_SECRET=your_jwt_secret_here_change_in_production
      - JWT_REFRESH_SECRET=your_refresh_secret_here
      - WECHAT_APP_ID=your_wechat_app_id
      - WECHAT_APP_SECRET=your_wechat_app_secret
      - ENCRYPTION_KEY=your_encryption_key_32_chars_long
      - LOG_LEVEL=info
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/public/uploads
      - app_exports:/app/public/exports
      - app_images:/app/public/images
    depends_on:
      - mongodb
      - redis
    networks:
      - xianyu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: xianyu-monitor-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin_password
      - MONGO_INITDB_DATABASE=xianyu_monitor
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - xianyu_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: xianyu-monitor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    networks:
      - xianyu_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: xianyu-monitor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - app_uploads:/var/www/uploads:ro
      - app_exports:/var/www/exports:ro
      - app_images:/var/www/images:ro
    depends_on:
      - xianyu-monitor
    networks:
      - xianyu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# 数据卷
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local
  app_exports:
    driver: local
  app_images:
    driver: local

# 网络
networks:
  xianyu_network:
    driver: bridge
